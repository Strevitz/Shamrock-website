<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/shamrock logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Shamrock Barber Shop – barbershop w centrum Warszawy, ul. Widok 10 obok Rotundy. Strzyżenie męskie, broda, golenie brzytwą z gorącym ręcznikiem. Rezerwacja online przez Booksy lub tel. 884 769 758."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pl_PL" />
    <meta property="og:site_name" content="Shamrock Barber Shop" />
    <meta property="og:title" content="Shamrock Barber Shop – barber Warszawa Centrum" />
    <meta
      property="og:description"
      content="Klasyczne i nowoczesne męskie fryzury, broda i golenie brzytwą przy ul. Widok 10 obok Rotundy. Zarezerwuj online."
    />
    <meta property="og:url" content="https://shamrockbarber.com/" />
    <meta property="og:image" content="https://shamrockbarber.com/logo512.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BarberShop",
        "name": "Shamrock Barber Shop",
        "url": "https://shamrockbarber.com",
        "image": "https://shamrockbarber.com/logo512.png",
        "telephone": "+48884769758",
        "email": "info@shamrockbarber.com",
        "priceRange": "39–180 zł",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "ul. Widok 10",
          "postalCode": "00-023",
          "addressLocality": "Warszawa",
          "addressCountry": "PL"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "09:00",
            "closes": "21:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Saturday",
            "opens": "09:00",
            "closes": "18:00"
          }
        ],
        "sameAs": [
          "https://www.instagram.com/shamrock_barbershop",
          "https://www.facebook.com/ShamrockWarszawa",
          "https://shamrockbarbershop.booksy.com"
        ],
        "potentialAction": {
          "@type": "ReserveAction",
          "target": "https://shamrockbarbershop.booksy.com"
        }
      }
    </script>
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/shamrock logo.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Shamrock Barber Shop – barber Warszawa Centrum, ul. Widok 10</title>
  </head>
  <body>
    <!-- Facebook Pixel ładuje się dopiero po zgodzie na cookies (src/components/CookieConsent.js). -->
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
